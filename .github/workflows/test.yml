name: test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly: catch Claude Code releases that change the mods API

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        claude: ['2.1.287', 'latest'] # the oldest version the README promises, and the newest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - name: Validate the mod
        run: claude plugin validate --strict .
      - name: Run the tests
        run: claude plugin test .
